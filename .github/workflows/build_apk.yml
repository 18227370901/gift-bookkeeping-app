# GitHub Actions APK & Release Build Workflow
name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev ccache libltdl-dev openjdk-17-jdk unzip
          pip install buildozer Cython

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 (Android APK)
          body: |
            ## 人情礼金记账 Android APK
            - 包含完整的离线 Flask + SQLite 架构
            - **内置并保留当前导入的所有样例数据 (`gift_bookkeeping.db`)**
            - 修复了模糊搜索、账密记住、重置密码与事由显示问题
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
