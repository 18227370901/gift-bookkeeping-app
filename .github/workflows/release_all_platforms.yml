name: Multi-Platform Direct Executables Release (Windows .exe, Android .apk)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build Direct Windows Executable (.exe)
  build-windows:
    name: Build Windows Direct .exe
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy flask-login cn2num pyinstaller

      - name: Build Standalone .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "GiftBookkeeping" --add-data "templates;templates" --add-data "gift_bookkeeping.db;." app.py

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v3
        with:
          name: giftbookkeeping-windows-exe
          path: dist/GiftBookkeeping.exe

  # 2. Build Direct Android APK (.apk)
  build-android:
    name: Build Android Direct .apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev ccache libltdl-dev openjdk-17-jdk unzip
          pip install buildozer Cython

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Move and Rename Direct APK
        run: |
          mkdir -p direct_apk
          cp bin/*.apk direct_apk/GiftBookkeeping_v1.0.0.apk || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: giftbookkeeping-android-apk
          path: direct_apk/GiftBookkeeping_v1.0.0.apk

  # 3. Create Release with Direct Runnable Files (.exe and .apk)
  create-release:
    name: Publish Direct Runnable Release (.exe & .apk)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Windows .exe Artifact
        uses: actions/download-artifact@v3
        with:
          name: giftbookkeeping-windows-exe
          path: release_files

      - name: Download Android .apk Artifact
        uses: actions/download-artifact@v3
        with:
          name: giftbookkeeping-android-apk
          path: release_files

      - name: Create GitHub Release with Direct Files
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Release v1.0.0 (Direct .exe and .apk Files)
          body: |
            ## 🚀 人情礼金记账 Release v1.0.0 (直接运行文件)

            无需解压 Zip！直接下载下方的文件即可双击运行或安装：

            - 💻 **`GiftBookkeeping.exe`**：Windows 单文件可执行程序，双击直接运行。
            - 📱 **`GiftBookkeeping_v1.0.0.apk`**：Android 安卓原生安装包，点击直接安装。

            **内置全量样例数据库 (`gift_bookkeeping.db`)，所有数据自动保留并带入！**
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
