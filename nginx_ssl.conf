# Nginx SSL 反向代理配置文件 (以自定义端口 1443 为例)
# 使用说明：
# 1. 将域名证书 server.crt 和私钥 server.key 放置于 Nginx 证书目录（如 /etc/nginx/ssl/）
# 2. 将本配置文件引用或放置于 Nginx 配置目录（如 /etc/nginx/conf.d/gift_bookkeeping.conf）
# 3. 如需更换自定义 HTTPS 端口（例如 8443, 2443 等），直接修改 listen 端口及 X-Forwarded-Port 参数。

upstream gift_app_backend {
    server 127.0.0.1:5000; # 本地 Flask / Gunicorn 服务端口
    keepalive 32;
}

# HTTP 自动重定向至 HTTPS 自定义端口 (重定向 80 / 8080 到 1443)
server {
    listen 80;
    listen 8080;
    server_name _;

    # 重定向所有 HTTP 请求到自定义 HTTPS 端口 1443
    return 301 https://$host:1443$request_uri;
}

# HTTPS 自定义端口配置 (示例端口 1443)
server {
    listen 1443 ssl http2;
    server_name _;

    # SSL 证书文件路径配置
    ssl_certificate     /etc/nginx/ssl/server.crt; # SSL 证书/公钥路径 (.crt / .pem)
    ssl_certificate_key /etc/nginx/ssl/server.key; # SSL 证书私钥路径 (.key)

    # SSL 安全协议与加密套件优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 安全响应头加固
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端上传文件大小限制
    client_max_body_size 20M;

    # 反向代理核心配置
    location / {
        proxy_pass http://gift_app_backend;
        
        # 核心请求头传递（确保 Flask 完美感知 HTTPS 协议及自定义 1443 端口）
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host:$server_port;

        # WebSocket 及长连接支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时时间设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}