<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年度礼金长图海报</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/5.3.0/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/font-awesome/6.4.0/css/all.min.css') }}" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; background: #f3efe9; color: #333; padding-bottom: 40px; }
        
        /* 顶部操作工具条 */
        .poster-toolbar { max-width: 420px; margin: 16px auto; padding: 12px 18px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        @media print { .poster-toolbar { display: none !important; } }

        /* 海报主体画布 */
        .poster-container { width: 375px; margin: 0 auto; background: linear-gradient(180deg, #fff9f0 0%, #fff2e0 100%); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 30px rgba(139,0,0,0.18); border: 1px solid rgba(212,160,23,0.3); }
        .poster-header { background: linear-gradient(135deg, #8B0000 0%, #b8142a 60%, #800000 100%); color: #fff; padding: 32px 20px 24px; text-align: center; position: relative; }
        .poster-header::after { content: ""; position: absolute; bottom: -10px; left: 0; right: 0; height: 20px; background: radial-gradient(ellipse at center, rgba(139,0,0,0.4) 0%, rgba(255,255,255,0) 70%); }
        .poster-header h1 { font-size: 23px; letter-spacing: 3px; margin-bottom: 6px; font-weight: 700; font-family: "KaiTi", "楷体", serif; }
        .poster-header .year-badge { display: inline-block; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); padding: 2px 14px; border-radius: 20px; font-size: 13px; letter-spacing: 1px; backdrop-filter: blur(4px); }
        
        .stats-section { padding: 22px 16px 12px; display: flex; justify-content: space-between; gap: 8px; }
        .stat-card { text-align: center; padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,0.85); flex: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid rgba(139,0,0,0.06); }
        .stat-card .label { font-size: 11px; color: #777; margin-bottom: 3px; font-weight: 500; }
        .stat-card .value { font-size: 17px; font-weight: bold; letter-spacing: -0.5px; }
        .stat-card.received .value { color: #198754; }
        .stat-card.sent .value { color: #dc3545; }
        .stat-card.net .value { color: #8B0000; }

        .section-title { padding: 14px 20px 8px; font-size: 13px; font-weight: bold; color: #8B0000; display: flex; align-items: center; justify-content: space-between; }
        .section-title span { display: flex; align-items: center; gap: 6px; }
        
        .top-list { padding: 0 16px 8px; }
        .top-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; margin-bottom: 6px; background: rgba(255,255,255,0.78); border-radius: 10px; font-size: 12.5px; border: 1px solid rgba(139,0,0,0.05); }
        .top-item .rank { font-weight: 800; color: #8B0000; width: 22px; font-size: 13px; }
        .top-item .rank-1 { color: #d4a017; font-size: 15px; }
        .top-item .rank-2 { color: #9aa0a6; font-size: 14px; }
        .top-item .rank-3 { color: #b87333; font-size: 14px; }
        .top-item .name { flex: 1; font-weight: 600; color: #333; }
        .top-item .amount { font-weight: bold; color: #8B0000; font-feature-settings: "tnum"; }

        .reason-section { padding: 0 16px 14px; }
        .reason-bar { display: flex; align-items: center; margin-bottom: 7px; font-size: 11.5px; }
        .reason-bar .r-name { width: 66px; text-align: right; margin-right: 8px; color: #555; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reason-bar .r-bar-bg { flex: 1; height: 12px; background: rgba(255,255,255,0.65); border-radius: 6px; overflow: hidden; border: 1px solid rgba(139,0,0,0.06); }
        .reason-bar .r-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #d4a017, #8B0000); }
        .reason-bar .r-pct { width: 42px; text-align: right; margin-left: 6px; color: #8B0000; font-weight: 700; font-size: 10.5px; }

        /* 美化页脚与二维码卡片 */
        .poster-footer { padding: 18px 20px 22px; text-align: center; border-top: 1px dashed rgba(139,0,0,0.18); background: rgba(255,255,255,0.4); }
        .poster-footer .brand { font-size: 13px; color: #8B0000; font-weight: 700; letter-spacing: 1px; }
        .poster-footer .slogan { font-size: 10.5px; color: #888; margin-top: 3px; margin-bottom: 12px; }
        
        .qr-card { display: inline-flex; flex-direction: column; align-items: center; background: #ffffff; padding: 10px 12px 8px; border-radius: 14px; border: 1.5px solid rgba(212,160,23,0.35); box-shadow: 0 4px 14px rgba(139,0,0,0.08); }
        .qr-card canvas { border-radius: 6px; display: block; }
        .qr-card .qr-tip { font-size: 9.5px; color: #8B0000; font-weight: 600; margin-top: 6px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <!-- 顶部操作工具条（下载、脱敏切换、返回） -->
    <div class="poster-toolbar">
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" onclick="generatePosterImage()" id="downloadBtn">
                <i class="fa-solid fa-camera me-1"></i>保存长图海报
            </button>
            <div class="form-check form-switch mb-0 ms-2">
                <input class="form-check-input" type="checkbox" id="maskToggle" onchange="toggleMaskMode(this.checked)">
                <label class="form-check-label small fw-bold text-dark" for="maskToggle">
                    <i class="fa-solid fa-user-secret text-secondary me-1"></i>数据脱敏
                </label>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-light text-muted border small" id="maskStatusBadge">完整模式</span>
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-2 py-0" onclick="window.close()" title="关闭窗口">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- 海报正文画布 -->
    <div id="posterContent" class="poster-container">
        <div class="poster-header">
            <h1><i class="fa-solid fa-award me-1" style="font-size: 20px; color: #ffd700;"></i>年度人情礼金账单</h1>
            <div class="year-badge" id="posterYear">2026 年度统计</div>
        </div>

        <div class="stats-section">
            <div class="stat-card received">
                <div class="label"><i class="fa-solid fa-arrow-down me-1 text-success"></i>总收礼</div>
                <div class="value" id="posterReceived">¥0</div>
            </div>
            <div class="stat-card sent">
                <div class="label"><i class="fa-solid fa-arrow-up me-1 text-danger"></i>总送礼</div>
                <div class="value" id="posterSent">¥0</div>
            </div>
            <div class="stat-card net">
                <div class="label"><i class="fa-solid fa-scale-balanced me-1 text-primary"></i>净结余</div>
                <div class="value" id="posterNet">¥0</div>
            </div>
        </div>

        <div class="section-title">
            <span><i class="fa-solid fa-crown text-warning me-1"></i>亲友往来榜 TOP 5</span>
            <small class="text-muted fw-normal" style="font-size: 10px;">往来频次与礼金总额</small>
        </div>
        <div class="top-list" id="posterTop5"></div>

        <div class="section-title">
            <span><i class="fa-solid fa-chart-pie text-danger me-1"></i>事由礼金构成</span>
            <small class="text-muted fw-normal" style="font-size: 10px;">人情消费占比</small>
        </div>
        <div class="reason-section" id="posterReasons"></div>

        <!-- 美化后的海报底部与二维码卡片 -->
        <div class="poster-footer">
            <div class="brand"><i class="fa-solid fa-book-bookmark me-1"></i>人情礼金记账系统</div>
            <div class="slogan">人情往来心有数 · 礼尚往来福长存</div>
            <div class="qr-card">
                <canvas id="posterQrCanvas" width="76" height="76"></canvas>
                <div class="qr-tip"><i class="fa-solid fa-qrcode me-1"></i>扫码体验系统</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/html2canvas/1.4.1/html2canvas.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/qrcode/1.0.0/qrcode.min.js') }}"></script>
    <script>
    var _posterRawData = null;
    var _isMasked = false;

    // 姓名脱敏函数：张三 -> 张*；欧阳六 -> 欧*六；王小明 -> 王*明
    function maskName(name) {
        if (!name) return "";
        var str = String(name).trim();
        if (str.length <= 1) return str + "*";
        if (str.length === 2) return str[0] + "*";
        return str[0] + "*".repeat(str.length - 2) + str[str.length - 1];
    }

    // 金额脱敏函数：保留首位与数量级，中间带*，如 ¥1*,**0
    function maskAmount(num) {
        var str = formatNum(num);
        if (str.length <= 2) return "**";
        return str[0] + "*".repeat(str.length - 2) + str[str.length - 1];
    }

    function toggleMaskMode(checked) {
        _isMasked = checked;
        document.getElementById('maskStatusBadge').textContent = _isMasked ? '已开启脱敏' : '完整模式';
        document.getElementById('maskStatusBadge').className = _isMasked ? 'badge bg-warning-subtle text-warning border border-warning-subtle small' : 'badge bg-light text-muted border small';
        renderPoster();
    }

    function renderPoster() {
        if (!_posterRawData) return;
        var d = _posterRawData;
        document.getElementById('posterYear').textContent = (d.year || '2026') + ' 年度人情账单';
        
        var totalRec = d.summary.total_received || 0;
        var totalSent = d.summary.total_sent || 0;
        var net = totalRec - totalSent;

        if (_isMasked) {
            document.getElementById('posterReceived').textContent = '¥' + maskAmount(totalRec);
            document.getElementById('posterSent').textContent = '¥' + maskAmount(totalSent);
            document.getElementById('posterNet').textContent = (net >= 0 ? '+¥' : '-¥') + maskAmount(Math.abs(net));
        } else {
            document.getElementById('posterReceived').textContent = '¥' + formatNum(totalRec);
            document.getElementById('posterSent').textContent = '¥' + formatNum(totalSent);
            document.getElementById('posterNet').textContent = (net >= 0 ? '+¥' : '-¥') + formatNum(Math.abs(net));
        }

        // TOP5 亲友往来榜
        var topHtml = '';
        if (d.top5 && d.top5.length > 0) {
            d.top5.forEach(function(item, i) {
                var rankClass = i === 0 ? 'rank-1' : (i === 1 ? 'rank-2' : (i === 2 ? 'rank-3' : ''));
                var rankIcon = i === 0 ? '<i class="fa-solid fa-medal"></i>' : (i + 1);
                var displayName = _isMasked ? maskName(item.name) : item.name;
                var displayAmount = _isMasked ? ('¥' + maskAmount(item.total)) : ('¥' + formatNum(item.total));
                topHtml += '<div class="top-item">' +
                    '<span class="rank ' + rankClass + '">' + rankIcon + '</span>' +
                    '<span class="name">' + displayName + '</span>' +
                    '<span class="amount">' + displayAmount + '</span>' +
                '</div>';
            });
        } else {
            topHtml = '<div style="text-align:center;color:#999;padding:12px;font-size:12px;">暂无亲友往来记录</div>';
        }
        document.getElementById('posterTop5').innerHTML = topHtml;

        // 事由礼金构成
        var reasonHtml = '';
        if (d.reasons && d.reasons.length > 0) {
            var maxAmount = Math.max.apply(null, d.reasons.map(function(r) { return r.amount; }));
            d.reasons.forEach(function(r) {
                var pct = maxAmount > 0 ? Math.round(r.amount / maxAmount * 100) : 0;
                reasonHtml += '<div class="reason-bar">' +
                    '<span class="r-name">' + r.reason + '</span>' +
                    '<div class="r-bar-bg"><div class="r-bar-fill" style="width:' + pct + '%"></div></div>' +
                    '<span class="r-pct">' + r.percentage + '%</span>' +
                '</div>';
            });
        } else {
            reasonHtml = '<div style="text-align:center;color:#999;padding:12px;font-size:12px;">暂无事由统计数据</div>';
        }
        document.getElementById('posterReasons').innerHTML = reasonHtml;

        // 生成高清美化二维码
        if (d.qr_url) {
            generateQRCode(d.qr_url);
        }
    }

    function loadPosterData() {
        fetch('/api/poster/data', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.code !== 200 || !data.data) return;
            _posterRawData = data.data;
            renderPoster();
        });
    }

    // 高清二维码绘制
    function generateQRCode(text) {
        var canvas = document.getElementById('posterQrCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var size = 76;

        if (typeof qrcode !== 'function') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#8B0000';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('扫码体验', size / 2, size / 2 + 4);
            return;
        }

        try {
            var qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            var count = qr.getModuleCount();
            var cellSize = size / count;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#1a1a1a';
            for (var row = 0; row < count; row++) {
                for (var col = 0; col < count; col++) {
                    if (qr.isDark(row, col)) {
                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    }
                }
            }
        } catch(e) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#8B0000';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('生成失败', size / 2, size / 2);
        }
    }

    function formatNum(n) {
        n = n || 0;
        return n >= 10000 ? (n / 10000).toFixed(1) + '万' : Number(n).toFixed(0);
    }

    function generatePosterImage() {
        var btn = document.getElementById('downloadBtn');
        var origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>正在渲染高清长图...';

        html2canvas(document.getElementById('posterContent'), {
            scale: 2.5,
            useCORS: true,
            backgroundColor: null
        }).then(function(canvas) {
            var link = document.createElement('a');
            link.download = '人情礼金账单_' + (_posterRawData ? _posterRawData.year : '2026') + (_isMasked ? '_脱敏版' : '') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            btn.disabled = false;
            btn.innerHTML = origHtml;
        }).catch(function(err) {
            btn.disabled = false;
            btn.innerHTML = origHtml;
            alert('海报生成失败: ' + err);
        });
    }

    document.addEventListener('DOMContentLoaded', loadPosterData);
    </script>
</body>
</html>
