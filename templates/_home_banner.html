{# V10.11.16 首页背景横幅（时间/农历/黄历宜忌/本月往来/天气）
   被 index.html 与 permission_tickets.html 引入。
   三栏式高雅布局，解决卡片中间留白，融合传统黄历与人情账本核心数据。 #}
<!-- ==================== 首页背景横幅 ==================== -->
<div class="hb-banner mb-4" id="homeBanner">
    <div class="hb-deco hb-deco-1"></div>
    <div class="hb-deco hb-deco-2"></div>
    <div class="row g-3 align-items-center position-relative">
        <!-- 左栏：时钟、公历、农历与节日班休 -->
        <div class="col-lg-4 col-md-5">
            <div class="hb-greet mb-1"><i class="fa-solid fa-sun me-2"></i><span id="hbGreet">你好</span>，{{ current_user.username }}</div>
            <div class="hb-clock" id="hbClock">--:--:--</div>
            <div class="hb-date mt-1" id="hbDate">--</div>
            <div class="hb-lunar" id="hbLunar">--</div>
            <div class="hb-badges mt-2" id="hbBadges"></div>
        </div>

        <!-- 中栏：高雅微晶卡片（黄历宜忌 + 本月往来微看板 + 快捷直达） -->
        <div class="col-lg-5 col-md-7">
            <div class="hb-mid-card">
                <!-- 黄历与宜忌条 -->
                <div class="d-flex align-items-center justify-content-between mb-2 pb-1 border-bottom border-light border-opacity-25">
                    <div class="hb-mid-title"><i class="fa-solid fa-compass me-1 text-warning"></i><strong>今日黄历</strong></div>
                    <span class="hb-fortune-tag" id="hbFortuneTag">--</span>
                </div>
                <div class="hb-yi-ji-box mb-2">
                    <div class="hb-yi-line mb-1">
                        <span class="hb-yi-badge">宜</span>
                        <span class="hb-yi-text" id="hbYiText">--</span>
                    </div>
                    <div class="hb-ji-line">
                        <span class="hb-ji-badge">忌</span>
                        <span class="hb-ji-text" id="hbJiText">--</span>
                    </div>
                </div>

                <!-- 本月人情收支看板 -->
                <div class="hb-ledger-stats mb-2" id="hbLedgerStats">
                    <div class="d-flex justify-content-between align-items-center small opacity-90 mb-1">
                        <span><i class="fa-solid fa-receipt me-1 opacity-75"></i>本月人情往来</span>
                        <span class="opacity-75" id="hbStatCount">-- 笔</span>
                    </div>
                    <div class="row g-1 text-center hb-stat-row">
                        <div class="col-4">
                            <div class="hb-stat-box">
                                <div class="hb-stat-label">收礼</div>
                                <div class="hb-stat-val text-warning" id="hbStatRec">--</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="hb-stat-box">
                                <div class="hb-stat-label">送礼</div>
                                <div class="hb-stat-val" id="hbStatSent">--</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="hb-stat-box">
                                <div class="hb-stat-label">净结余</div>
                                <div class="hb-stat-val" id="hbStatNet">--</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 快捷功能直达 -->
                <div class="hb-quick-actions d-flex flex-wrap gap-2">
                    <button type="button" class="hb-action-chip" id="hbBtnAddRecord"><i class="fa-solid fa-pen-to-square me-1"></i>记一笔</button>
                    <a href="/banquets" class="hb-action-chip"><i class="fa-solid fa-wine-glass me-1"></i>办宴席</a>
                    <a href="/dashboard" class="hb-action-chip"><i class="fa-solid fa-chart-pie me-1"></i>看分析</a>
                    <a href="/weather" class="hb-action-chip"><i class="fa-solid fa-calendar-days me-1"></i>万年历</a>
                </div>
            </div>
        </div>

        <!-- 右栏：天气实况 -->
        <div class="col-lg-3 col-md-12">
            <div class="hb-weather" id="hbWeatherBox">
                <div class="hb-weather-skeleton">
                    <div class="hb-weather-tip mb-2">
                        <i class="fa-solid fa-location-crosshairs fa-spin me-1 text-warning"></i><span class="hb-tip-text">正在加载最新定位天气数据…</span>
                    </div>
                    <div class="d-flex align-items-center justify-content-end gap-2 mb-1">
                        <i class="fa-solid fa-cloud-sun fa-2x hb-pulse-icon"></i>
                        <span class="hb-shimmer-bar" style="width: 72px; height: 16px;"></span>
                    </div>
                    <div class="d-flex justify-content-end gap-2 align-items-baseline">
                        <span class="hb-shimmer-bar" style="width: 80px; height: 28px;"></span>
                        <span class="hb-shimmer-bar" style="width: 48px; height: 16px;"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* 首页背景横幅：红金渐变主视觉（白天/黑夜双主题，自包含纯 CSS 零图片） */
/* 组件设计规范 3: 横幅卡（Hero Banner）圆角 rounded-3xl，三色渐变背景，叠加两处大尺寸绝对定位毛玻璃微光斑（bg-white/10 blur-2xl），内嵌半透明玻璃卡片 */
.hb-banner {
    position: relative; overflow: hidden;
    border-radius: 1.5rem !important; /* rounded-3xl */
    padding: 1.75rem 2rem; color: #fff;
    /* bg-gradient-to-r from-orange-500 via-rose-500 to-amber-500 */
    background: linear-gradient(135deg, #f97316 0%, #f43f5e 50%, #f59e0b 100%) !important;
    box-shadow: 0 0.75rem 2.5rem rgba(249, 115, 22, 0.28), 0 0.2rem 0.6rem rgba(244, 63, 94, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.22);
}
[data-bs-theme="dark"] .hb-banner {
    background: linear-gradient(135deg, #7c2d12 0%, #881337 50%, #78350f 100%) !important;
    box-shadow: 0 0.75rem 2.5rem rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.10);
}
.hb-banner { animation: hbBannerFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes hbBannerFadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 两处大尺寸绝对定位毛玻璃微光斑（bg-white/10 blur-2xl） */
.hb-deco { position: absolute; border-radius: 50%; pointer-events: none; }
.hb-deco-1 {
    width: 380px; height: 380px; right: -80px; top: -140px;
    background: rgba(255, 255, 255, 0.14) !important;
    filter: blur(48px) !important;
    -webkit-filter: blur(48px) !important;
    animation: hbOrbFloat1 12s ease-in-out infinite;
}
.hb-deco-2 {
    width: 320px; height: 320px; left: -70px; bottom: -120px;
    background: rgba(255, 255, 255, 0.12) !important;
    filter: blur(40px) !important;
    -webkit-filter: blur(40px) !important;
    animation: hbOrbFloat2 10s ease-in-out infinite;
}
@keyframes hbOrbFloat1 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.85; }
    50% { transform: translate(-14px, 10px) scale(1.08); opacity: 1; }
}
@keyframes hbOrbFloat2 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.85; }
    50% { transform: translate(12px, -8px) scale(1.06); opacity: 1; }
}
.hb-greet { font-size: 0.95rem; opacity: 0.92; }
.hb-clock {
    font-size: 2.5rem; font-weight: 700; line-height: 1.15; letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
}
.hb-date { font-size: 0.98rem; opacity: 0.95; }
.hb-lunar { font-size: 0.88rem; opacity: 0.88; }
.hb-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.hb-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; line-height: 1.5; }
.hb-badge.term { background: rgba(25, 135, 84, 0.92); }
.hb-badge.festival { background: #a61e4d; }
.hb-badge.rest { background: #e03131; }
.hb-badge.work { background: #6c757d; }

/* 中栏微晶玻璃卡片 */
.hb-mid-card {
    background: rgba(255, 255, 255, 0.16) !important; /* bg-white/15 */
    backdrop-filter: blur(16px) !important; /* backdrop-blur-md */
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1px solid rgba(255, 255, 255, 0.22) !important; /* border-white/20 */
    border-radius: 1rem !important;
    padding: 0.95rem 1.2rem;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
}
[data-bs-theme="dark"] .hb-mid-card {
    background: rgba(0, 0, 0, 0.22);
    border-color: rgba(255, 255, 255, 0.12);
}
.hb-mid-title { font-size: 0.88rem; }
.hb-fortune-tag {
    font-size: 0.75rem; padding: 1px 8px; border-radius: 999px;
    background: rgba(255, 215, 0, 0.22); border: 1px solid rgba(255, 215, 0, 0.45);
    color: #fff9c4; font-weight: 500;
}
.hb-yi-ji-box { font-size: 0.82rem; }
.hb-yi-line, .hb-ji-line { display: flex; align-items: baseline; gap: 6px; }
.hb-yi-badge {
    background: #2e7d32; color: #fff; padding: 1px 6px;
    border-radius: 4px; font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
}
.hb-ji-badge {
    background: #c62828; color: #fff; padding: 1px 6px;
    border-radius: 4px; font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
}
.hb-yi-text { opacity: 0.95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-ji-text { opacity: 0.88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 本月人情微统计条 */
.hb-stat-box {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 6px; padding: 3px 6px;
}
.hb-stat-label { font-size: 0.72rem; opacity: 0.8; }
.hb-stat-val { font-size: 0.88rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* 快捷按钮 */
.hb-action-chip {
    display: inline-flex; align-items: center; text-decoration: none;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff; font-size: 0.78rem; padding: 3px 10px; border-radius: 999px;
    cursor: pointer; transition: all 0.2s ease;
}
.hb-action-chip:hover {
    background: rgba(255, 255, 255, 0.3); color: #fff;
    transform: translateY(-1px);
}

/* 右栏天气与骨架屏入场微动效 */
.hb-weather { text-align: right; }
.hb-weather-loading { font-size: 0.9rem; opacity: 0.85; }
.hb-weather-skeleton { opacity: 0.95; }
.hb-weather-tip {
    font-size: 0.74rem; color: #fff;
    display: inline-flex; align-items: center;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(6px);
    padding: 2px 10px; border-radius: 999px;
    animation: hbTipPulse 2s ease-in-out infinite;
}
@keyframes hbTipPulse {
    0%, 100% { opacity: 0.85; transform: scale(0.98); }
    50% { opacity: 1; transform: scale(1.02); }
}
.hb-pulse-icon {
    opacity: 0.7;
    animation: hbPulseGlow 1.8s ease-in-out infinite;
}
@keyframes hbPulseGlow {
    0%, 100% { opacity: 0.5; transform: scale(0.96); }
    50% { opacity: 0.95; transform: scale(1.06); }
}
.hb-shimmer-bar {
    display: inline-block; border-radius: 6px;
    background: linear-gradient(90deg, rgba(255,255,255,0.15) 25%, rgba(255,255,255,0.32) 50%, rgba(255,255,255,0.15) 75%);
    background-size: 200% 100%;
    animation: hbShimmer 1.8s infinite linear;
}
@keyframes hbShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
.hb-weather-content {
    animation: hbWeatherPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes hbWeatherPop {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.hb-city { font-size: 0.9rem; opacity: 0.92; }
.hb-src-badge { font-size: 0.7rem; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.22); margin-left: 6px; }
.hb-temp-line { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; margin-top: 2px; }
.hb-temp { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.22); }
.hb-temp-unit { font-size: 1.1rem; opacity: 0.9; }
.hb-desc { font-size: 1rem; opacity: 0.95; }
.hb-minmax { font-size: 0.85rem; opacity: 0.88; margin-top: 2px; }

/* 响应式 */
@media (max-width: 991.98px) {
    .hb-weather { text-align: left; margin-top: 0.5rem; }
    .hb-temp-line { justify-content: flex-start; }
}
@media (max-width: 767.98px) {
    .hb-banner { padding: 1.15rem 1.15rem; }
    .hb-clock { font-size: 2rem; }
    .hb-temp { font-size: 2rem; }
}
</style>

<script src="{{ url_for('static', filename='js/lunar_utils.js') }}"></script>
<script>
(function () {
    'use strict';
    var el = function (id) { return document.getElementById(id); };
    var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
    var WEEK_CN = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

    // ---- 问候语 + 图标 ----
    var greet = '你好', icon = 'fa-sun';
    var h = new Date().getHours();
    if (h < 5) { greet = '夜深了'; icon = 'fa-moon-stars'; }
    else if (h < 9) { greet = '早上好'; icon = 'fa-sun'; }
    else if (h < 12) { greet = '上午好'; icon = 'fa-mug-hot'; }
    else if (h < 14) { greet = '中午好'; icon = 'fa-utensils'; }
    else if (h < 18) { greet = '下午好'; icon = 'fa-sun'; }
    else if (h < 22) { greet = '晚上好'; icon = 'fa-moon'; }
    else { greet = '夜深了'; icon = 'fa-moon-stars'; }
    el('hbGreet').textContent = greet;
    el('hbGreet').parentElement.querySelector('i').className = 'fa-solid ' + icon + ' me-2';

    // ---- 时钟走秒 ----
    var now = new Date();
    var y = now.getFullYear(), mo = now.getMonth() + 1, day = now.getDate();
    var F = (typeof LunarUtils !== 'undefined') ? LunarUtils.getFullInfo(y, mo, day) : null;
    var weekText = (F && F.week) ? F.week : WEEK_CN[now.getDay()];

    function tick() {
        var t = new Date();
        el('hbClock').textContent = pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + ':' + pad2(t.getSeconds());
        el('hbDate').textContent = t.getFullYear() + '年' + (t.getMonth() + 1) + '月' + t.getDate() + '日 ' + weekText;
    }
    tick();
    setInterval(tick, 1000);

    // ---- 农历、节气与黄历宜忌 ----
    if (F) {
        el('hbLunar').textContent = F.lunarFull;
        var badges = '';
        if (F.term) { badges += '<span class="hb-badge term" title="节气">' + F.term + '</span>'; }
        (F.festivals || []).forEach(function (f) { badges += '<span class="hb-badge festival" title="节日">' + f + '</span>'; });
        el('hbBadges').innerHTML = badges;

        if (F.fortune) {
            el('hbFortuneTag').textContent = F.fortune.name + ' · ' + F.fortune.tag;
            el('hbYiText').textContent = F.fortune.yi || '诸事皆宜';
            el('hbJiText').textContent = F.fortune.ji || '诸事不忌';
        }
    } else {
        el('hbLunar').textContent = '';
        el('hbFortuneTag').textContent = '吉日';
        el('hbYiText').textContent = '诸事皆宜';
        el('hbJiText').textContent = '诸事不忌';
    }

    // ---- 快捷记一笔按钮联动 ----
    var addBtn = el('hbBtnAddRecord');
    if (addBtn) {
        addBtn.addEventListener('click', function () {
            var modalEl = document.getElementById('addRecordModal');
            if (modalEl && typeof bootstrap !== 'undefined') {
                var modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                modal.show();
            } else {
                window.location.href = '/#addRecordModal';
            }
        });
    }

    // ---- 天气与人情账本统计 (/api/home/weather) ----
    var uid = (document.body.dataset && document.body.dataset.userId) ? String(document.body.dataset.userId) : '0';
    var qParams = [];
    try {
        var lastMode = localStorage.getItem('gift_weather_' + uid + '_last_query_mode');
        if (lastMode === 'coords') {
            var lat = localStorage.getItem('gift_weather_' + uid + '_last_query_lat');
            var lon = localStorage.getItem('gift_weather_' + uid + '_last_query_lon');
            var label = localStorage.getItem('gift_weather_' + uid + '_last_query_label');
            if (lat && lon) {
                qParams.push('lat=' + encodeURIComponent(lat));
                qParams.push('lon=' + encodeURIComponent(lon));
                if (label) qParams.push('label=' + encodeURIComponent(label));
            }
        } else if (lastMode === 'city') {
            var c = localStorage.getItem('gift_weather_' + uid + '_last_query_city');
            if (c) qParams.push('city=' + encodeURIComponent(c));
        } else {
            if (localStorage.getItem('gift_weather_' + uid + '_mode') === 'text') {
                var legacyCity = (localStorage.getItem('gift_weather_' + uid + '_city') || '').trim();
                if (legacyCity) qParams.push('city=' + encodeURIComponent(legacyCity));
            }
        }
    } catch (e) { }

    var qStr = qParams.length ? ('?' + qParams.join('&')) : '';
    fetch('/api/home/weather' + qStr, { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
            var data = (j && j.code === 200) ? j.data : null;
            if (!data) { hideWeather(); return; }

            // 班/休徽章
            if (data.badge) {
                var b = data.badge;
                el('hbBadges').insertAdjacentHTML('beforeend',
                    '<span class="hb-badge ' + (b.holiday ? 'rest' : 'work') + '" title="' +
                    (b.holiday ? '今日休息日：' : '今日调休补班：') + (b.name || '') + '">' +
                    (b.holiday ? '休' : '班') + '</span>');
            }

            // 本月人情往来统计渲染
            if (data.ledger) {
                var l = data.ledger;
                el('hbStatRec').textContent = '¥' + Number(l.received || 0).toLocaleString('zh-CN', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                el('hbStatSent').textContent = '¥' + Number(l.sent || 0).toLocaleString('zh-CN', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                var netVal = Number(l.net || 0);
                el('hbStatNet').textContent = (netVal >= 0 ? '+' : '') + '¥' + netVal.toLocaleString('zh-CN', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                el('hbStatNet').className = 'hb-stat-val ' + (netVal >= 0 ? 'text-success' : 'text-danger');
                el('hbStatCount').textContent = '共 ' + (l.count || 0) + ' 笔往来';
            } else {
                var statBox = el('hbLedgerStats');
                if (statBox) statBox.style.display = 'none';
            }

            // 天气渲染
            if (!data.weather) { hideWeather(); return; }
            var w = data.weather;
            var isPreset = !data.has_weather_permission || data.is_admin_preset;
            var srcBadgeText = isPreset ? '管理员预设' : (data.source === 'user' ? '我的地点' : '管理员预设');
            var srcBadge = '<span class="hb-src-badge" title="地点来源">' + srcBadgeText + '</span>';
            var iconHtml = w.icon ? '<i class="fa-solid ' + w.icon + ' me-2"></i>' : '';
            var tempText = (w.temp === null || w.temp === undefined) ? '--' : Math.round(w.temp);
            var minmax = '';
            if (w.today_max !== null && w.today_max !== undefined) {
                minmax += '今 ' + Math.round(w.today_max) + '°/' + Math.round(w.today_min) + '°';
                if (w.tomorrow_max !== null && w.tomorrow_max !== undefined) {
                    minmax += ' · 明 ' + Math.round(w.tomorrow_max) + '°/' + Math.round(w.tomorrow_min) + '°';
                }
            }

            var extraAction = '';
            if (isPreset) {
                extraAction = '<div class="mt-1 small opacity-75" title="管理员预设"><i class="fa-solid fa-circle-info me-1"></i>这是管理员预设的地址</div>';
            } else {
                extraAction = '<div class="mt-1"><a href="/weather" class="text-white text-opacity-75 small text-decoration-none"><i class="fa-solid fa-angle-right me-1"></i>查看15天预报</a></div>';
            }

            el('hbWeatherBox').innerHTML =
                '<div class="hb-weather-content">' +
                '<div class="hb-city"><i class="fa-solid fa-location-dot me-1"></i>' + data.city + srcBadge + '</div>' +
                '<div class="hb-temp-line"><span class="hb-temp">' + tempText + '</span><span class="hb-temp-unit">°C</span><span class="hb-desc">' + iconHtml + (w.desc || '') + '</span></div>' +
                (minmax ? '<div class="hb-minmax">' + minmax + '</div>' : '') +
                extraAction +
                '</div>';
        })
        .catch(function () { hideWeather(); });

    function hideWeather() {
        el('hbWeatherBox').style.display = 'none';
    }
})();
</script>
<!-- ==================== /首页背景横幅 ==================== -->
