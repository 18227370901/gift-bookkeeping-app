# Nginx SSL 反向代理配置文件（占位符模板）
# 用途：将本地后端服务通过 HTTPS 对外暴露；多项目共用同一监听端口（如 443），
#       依靠 SNI（server_name 域名）区分流量，每个项目渲染生成一份独立配置文件。
# 使用方式：不要手工修改占位符，由 run.sh 的 setup_nginx_config() 渲染输出到
#       $NGINX_CONF_DIR/$PROJECT_NAME.conf，各变量均通过环境变量覆盖。
#
# 占位符说明（由 run.sh 自动替换）：
#   __UPSTREAM_NAME__   upstream 名称（PROJECT_NAME_backend，防止多项目重名冲突）
#   __BACKEND_PORT__    本地后端服务端口（run.sh 变量 PORT）
#   __NGINX_PORT__      Nginx 对外监听端口（run.sh 变量 NGINX_PORT，替换后可含 default_server）
#   __SNI_DOMAIN__      SNI 域名（写入 server_name，run.sh 变量 SNI_DOMAIN）
#   __SSL_CERT__        SSL 证书路径（run.sh 变量 SSL_CERT）
#   __SSL_KEY__         SSL 私钥路径（run.sh 变量 SSL_KEY）

upstream __UPSTREAM_NAME__ {
    server 127.0.0.1:__BACKEND_PORT__;   # 本地 Flask/Gunicorn 后端服务
    keepalive 32;
}

# HTTPS 服务（多项目共用监听端口，依靠 SNI 域名区分流量）
server {
    listen __NGINX_PORT__ ssl;           # 监听 HTTPS（SNI_DEFAULT_SERVER=1 时为兜底 server）
    http2 on;                            # 单独启用 HTTP/2（新语法）
    server_name __SNI_DOMAIN__;

    # SSL 证书配置
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    # SSL 安全优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 上传文件大小限制
    client_max_body_size 20M;

    # 反向代理
    location / {
        proxy_pass http://__UPSTREAM_NAME__;

        # 协议与端口透传（443 为标准端口，Host 不附带端口号，避免后端生成带 :443 的 URL）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket 与长连接协议透传（避免写死 upgrade 导致普通 HTTP 请求挂起卡死）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
